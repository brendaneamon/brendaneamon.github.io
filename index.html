<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brendan Magee</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #fff;
        color: #1a1a1a;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 0.4rem;
      }
      p {
        font-size: 1rem;
        color: #555;
        margin-bottom: 1.5rem;
      }
      nav a {
        color: #555;
        text-decoration: none;
        margin: 0 0.75rem;
        font-size: 0.95rem;
        transition: color 0.2s ease;
      }
      nav a:hover {
        color: #1a1a1a;
        text-decoration: underline;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a1a;
          color: #e5e5e5;
        }
        p,
        nav a {
          color: #999;
        }
        nav a:hover {
          color: #e5e5e5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brendan Magee</h1>
      <p>Software engineer at Flox · London</p>
      <nav>
        <a href="https://github.com/brendaneamon">GitHub</a>
        <a href="https://www.linkedin.com/in/brendan-eamon-magee/">LinkedIn</a>
      </nav>
    </main>
  </body>
</html>
